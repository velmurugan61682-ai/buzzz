openapi: 3.1.0
info:
  title: BUZZZ Platform API
  version: 1.0.0
  description: 'The single backend interface for BUZZZ. Every endpoint is workspace scoped, permission checked and audited.
    Side-effecting endpoints accept an idempotency key.


    **Status: specification.** No endpoint below is implemented yet; the current product is a browser artifact with zero server
    routes. This document defines the target so implementation is consistent.'
  contact:
    name: BUZZZ
    url: https://buzzzbuzzz.com
servers:
- url: https://api.buzzzbuzzz.com/api/v1
  description: Production
- url: https://staging-api.buzzzbuzzz.com/api/v1
  description: Staging
security:
- bearerAuth: []
tags:
- name: Authentication
- name: Users
- name: Workspace
- name: CRM
- name: Identity
- name: Inbox
- name: Calls
- name: Appointments
- name: Agents
- name: Agent Library
- name: Automations
- name: Campaigns
- name: Knowledge
- name: Approvals
- name: BUZZZ AI
- name: Analytics
- name: Events
- name: Audit
- name: Integrations
- name: Social
- name: Billing
- name: Notifications
- name: Search
- name: Files
- name: Webhooks
- name: Admin
- name: Revenue
- name: Enterprise
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register a user and create a workspace
      description: Creates the owner account and its first workspace.
      security: []
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in
      description: Returns an access token and sets a refresh cookie.
      security: []
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out
      description: Revokes the current session.
      security: []
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh the access token
      description: Rotates the refresh token; reuse of an old token revokes the family.
      security: []
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      tags:
      - Authentication
      summary: Request a password reset
      description: Always returns 202 so the endpoint cannot enumerate accounts.
      security: []
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify:
    post:
      tags:
      - Authentication
      summary: Verify an email address
      description: ''
      security: []
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/enroll:
    post:
      tags:
      - Authentication
      summary: Begin MFA enrolment
      description: ''
      security: []
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/verify:
    post:
      tags:
      - Authentication
      summary: Confirm an MFA challenge
      description: ''
      security: []
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sessions:
    get:
      tags:
      - Authentication
      summary: List active sessions
      responses:
        '200':
          description: Sessions
    delete:
      tags:
      - Authentication
      summary: Revoke all other sessions
      responses:
        '204':
          description: Revoked
  /contacts:
    get:
      tags:
      - CRM
      summary: List Contacts
      operationId: listContacts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: Page of Contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - CRM
      summary: Create a Contact
      operationId: createContact
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '402':
          $ref: '#/components/responses/PlanLimit'
  /contacts/{id}:
