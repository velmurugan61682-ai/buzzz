components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short lived access token. The workspace is taken from the token, never from the request body.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: cursor
      in: query
      schema:
        type: string
      description: Keyset cursor. Page fifty costs the same as page one.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Field name, prefix with - for descending.
    Query:
      name: q
      in: query
      schema:
        type: string
    Filter:
      name: filter
      in: query
      schema:
        type: string
      description: field:op:value, repeatable. Example filter=status:eq:Qualified
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    Compare:
      name: compare
      in: query
      schema:
        type: string
        enum:
        - previous_period
        - previous_year
        - none
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Required on anything that sends, charges or dials. A repeat returns the original result rather than acting
        twice.
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted. The body names the required role or autonomy level.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found in this workspace. Returned instead of 403 so ids cannot be probed across tenants.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with current state, such as a double booking
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: Validation failed; field errors included
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlanLimit:
      description: Blocked by the plan entitlement or usage allowance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limited; Retry-After is set
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          example: autonomy_insufficient
        message:
          type: string
          example: Create deals needs autonomy Level 3. Kai runs at Level 2.
        request_id:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        docs:
          type: string
          format: uri
    Page:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    Contact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
        source:
          type: string
        owner:
          type: string
        stage:
          type: string
        location:
          type: string
        score:
          type: integer
          readOnly: true
          description: Computed on read from engagement, appointments, deals and memory.
        tags:
          type: array
          items:
            type: string
        channels:
          type: array
          items:
            type: string
        workspace_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
    Deal:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        contact_id:
          type: string
        value:
          type: integer
          description: Minor units
        stage:
          type: string
        probability:
          type: integer
        owner:
          type: string
    Pipeline:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        stages:
          type: array
          items:
            type: object
    Task:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        due:
          type: string
          format: date-time
        assignee:
          type: string
        done:
          type: boolean
    Segment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        filter:
          type: object
    CustomField:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
    Identity:
      type: object
      properties:
        id:
          type: string
        contact_id:
          type: string
        kind:
          type: string
          enum:
          - phone
          - email
          - whatsapp
          - instagram
          - telegram
          - external
        value:
          type: string
        confidence:
          type: number
    Conversation:
      type: object
      properties:
        id:
          type: string
        contact_id:
          type: string
        channel:
          type: string
        state:
          type: string
          enum:
          - Open
          - Waiting
          - Escalated
          - Resolved
        assignee:
          type: string
        ai:
          type: boolean
    Call:
      type: object
      properties:
        id:
          type: string
        contact_id:
          type: string
        direction:
          type: string
          enum:
          - inbound
          - outbound
        status:
          type: string
          enum:
          - initiated
          - ringing
          - answered
          - ended
          - failed
        duration_seconds:
          type: integer
        outcome:
          type: string
    Appointment:
      type: object
      properties:
        id:
          type: string
        contact_id:
          type: string
        start:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        staff_id:
          type: string
        service_id:
          type: string
        status:
          type: string
          enum:
          - Pending
          - Confirmed
          - In progress
          - Completed
          - Cancelled
          - No show
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
          - Draft
          - Active
          - Paused
          - Archived
        autonomy:
          type: integer
          minimum: 0
          maximum: 4
          description: Capped at run time by the workspace ceiling.
        tools:
          type: array
          items:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: boolean
        guardrails:
          type: array
          items:
            type: string
        escalation:
          type: object
    AgentTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        industry:
          type: string
        category:
          type: string
        agent:
          $ref: '#/components/schemas/Agent'
        workflows:
          type: array
          items:
            type: object
    Workflow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - Draft
          - Published
          - Paused
          - Archived
        version:
          type: integer
        graph:
          type: object
          properties:
            nodes:
              type: array
              items:
                type: object
            edges:
              type: array
              items:
                type: object
    Campaign:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        channel:
          type: string
        status:
          type: string
          enum:
          - Draft
          - Scheduled
          - Running
          - Paused
          - Completed
        audience:
          type: object
    KnowledgeSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
          - queued
          - fetching
          - parsing
          - chunking
          - embedding
          - indexing
          - indexed
          - failed
        priority:
          type: integer
        version:
          type: integer
    Approval:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        risk:
          type: string
          enum:
          - Low
          - Medium
          - High
          - Critical
        required_role:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - expired
          - executing
          - executed
          - failed
        sla_minutes:
          type: integer
        payload:
          type: object
    Integration:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        state:
          type: string
          enum:
          - not_connected
          - connected
          - degraded
          - reauth_required
          - error
          - syncing
        capabilities:
          type: array
          items:
            type: string
    Post:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        platforms:
          type: array
          items:
            type: string
        status:
          type: string
    Notification:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        priority:
          type: string
          enum:
          - info
          - success
          - warning
          - critical
        read:
          type: boolean
        link:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
          - Owner
          - Admin
          - Manager
          - Finance Manager
          - Marketing Manager
          - Sales Manager
          - Support Lead
          - Agent
    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - Subscription
          - One off
          - Service
          - Usage
        billing_period:
          type: string
          enum:
          - once
          - monthly
          - quarterly
          - annual
        price_minor:
          type: integer
          description: Minor units
        cost_minor:
          type: integer
        tax_rate:
          type: number
        active:
          type: boolean
    QuoteItem:
      type: object
      properties:
        product_id:
          type: string
        qty:
          type: number
        unit_price_minor:
          type: integer
        discount_pct:
          type: number
          maximum: 100
        tax_rate:
          type: number
    Quote:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        contact_id:
          type: string
        deal_id:
          type: string
        status:
          type: string
          enum:
          - draft
          - sent
          - viewed
          - accepted
          - declined
          - expired
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
        net_minor:
          type: integer
          readOnly: true
        tax_minor:
          type: integer
          readOnly: true
        total_minor:
          type: integer
          readOnly: true
        mrr_minor:
          type: integer
          readOnly: true
        expires_at:
          type: string
          format: date-time
    Sequence:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        stop_on_reply:
          type: boolean
        stop_on_booking:
          type: boolean
        steps:
          type: array
          items:
            type: object
            properties:
              day_offset:
