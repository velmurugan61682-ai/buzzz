# Local development stack. Production uses managed Postgres and Redis.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: buzzz
      POSTGRES_PASSWORD: buzzz
      POSTGRES_DB: buzzz
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../server/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzzz"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
